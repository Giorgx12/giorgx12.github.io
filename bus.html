<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>C145 Inverigo Monitor</title>
<style>
  body { margin: 0; background: #fff; }
</style>
</head>
<body>

<canvas id="k" width="600" height="800"></canvas>

<script>
const W = 600;
const H = 800;

const MOOVIT_URL =
  "https://moovitapp.com/ws/nextArrivals?stopId=401020&metroAreaId=1020";

const PROXY = "https://corsproxy.io/?" + encodeURIComponent(MOOVIT_URL);

async function getMoovit() {
  try {
    const r = await fetch(PROXY);
    const json = await r.json();
    const next = json.nextArrivals.find(x => x.lineName.includes("145"));
    if (!next) return null;

    return {
      aimed: new Date(next.aimedArrivalTime),
      expected: new Date(next.expectedArrivalTime)
    };
  } catch (e) {
    return null;
  }
}

function draw(info) {
  const c = document.getElementById("k");
  const ctx = c.getContext("2d");

  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, W, H);

  const now = new Date();
  const hours = now.toLocaleTimeString("it-IT", {hour12: false});

  ctx.fillStyle = "black";
  ctx.font = "70px Arial";
  ctx.fillText("Ora:", 40, 120);
  ctx.font = "90px Arial";
  ctx.fillText(hours, 40, 220);

  if (!info) {
    ctx.font = "60px Arial";
    ctx.fillText("Nessun C145", 40, 400);
    return;
  }

  const diff = info.expected - now;
  const mins = Math.floor(diff / 60000);
  const secs = Math.floor((diff / 1000) % 60);

  ctx.font = "70px Arial";
  ctx.fillText("Countdown:", 40, 360);
  ctx.font = "80px Arial";
  ctx.fillText(`${mins}m ${secs}s`, 40, 460);

  const delay = Math.floor((info.expected - info.aimed) / 60000);

  ctx.font = "70px Arial";
  ctx.fillText("Ritardo:", 40, 600);
  ctx.font = "80px Arial";
  ctx.fillText(`${delay} min`, 40, 700);
}

async function update() {
  const info = await getMoovit();
  draw(info);

  // Esporta PNG
  const c = document.getElementById("k");
  const png = c.toDataURL("image/png");

  // Mostra la PNG come immagine (per il Kindle)
  document.body.innerHTML = `<img src="${png}" />`;
}

setInterval(update, 10000);
update();
</script>

</body>
</html>
