<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="out">In attesa di input...</pre>
<script>
  const params = new URLSearchParams(window.location.search);
  const q = params.get('q');
  
  if (!q) {
    document.body.innerText = "Errore: Inserisci il parametro ?q=termine";
  } else {
    fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1`)
      .then(res => res.json())
      .then(data => {
        let text = data.AbstractText || data.Definition || (data.RelatedTopics[0] && data.RelatedTopics[0].Text) || "Nessun risultato trovato.";
        document.body.innerText = text;
      })
      .catch(() => {
        document.body.innerText = "Errore durante la ricerca.";
      });
  }
</script>
</body>
</html>
